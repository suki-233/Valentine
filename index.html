<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>💘 En fråga...</title>
  <style>
    :root{
      --bg1:#fff1f5; --bg2:#ffe4e6;
      --card:#ffffffcc; --text:#111827; --muted:#6b7280; --border:#e5e7eb;
      --yes:#22c55e; --no:#ef4444;
    }
    *{box-sizing:border-box}
    body{
      margin:0; min-height:100vh; display:grid; place-items:center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color:var(--text);
      background: radial-gradient(circle at top, var(--bg1), var(--bg2));
      overflow:hidden;
    }
    .card{
      width:min(92vw, 560px);
      background:var(--card);
      border:1px solid var(--border);
      border-radius:22px;
      padding:22px;
      text-align:center;
      box-shadow:0 18px 60px rgba(0,0,0,.14);
      backdrop-filter: blur(10px);
      position:relative;
      z-index:5;
    }
    .title{ margin:0 0 8px; font-size:clamp(22px, 4vw, 34px); line-height:1.1; }
    .subtitle{ margin:0 0 16px; color:var(--muted); font-size:14px; }

    .buttons{
      display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:10px;
    }
    button{
      border:1px solid var(--border);
      padding:12px 18px;
      border-radius:999px;
      font-weight:900;
      cursor:pointer;
      box-shadow:0 10px 22px rgba(0,0,0,.10);
      transition: transform .12s ease, opacity .12s ease, filter .12s ease;
      user-select:none;
      min-width:140px;
      font-size:16px;
    }
    button:active{ transform: scale(.98); }
    #yesBtn{ background:var(--yes); color:white; position:relative; z-index:2; }
    #noBtn { background:var(--no);  color:white; position:relative; z-index:1; }

    .hint{ margin-top:12px; font-size:12px; color:var(--muted); }

    /* Popup */
    .overlay{
      position:fixed; inset:0;
      display:none; place-items:center;
      background: rgba(0,0,0,.40);
      z-index:50;
      padding:18px;
    }
    .overlay.show{ display:grid; }

    .modal{
      width:min(92vw, 650px);
      background:#fff;
      border-radius:22px;
      overflow:hidden;
      border:1px solid var(--border);
      box-shadow:0 26px 90px rgba(0,0,0,.35);
      text-align:center;
    }
    .modal .top{ padding:18px 18px 10px; }
    .modal h2{ margin:0; font-size:22px; }
    .modal p{ margin:6px 0 0; color:var(--muted); font-weight:700; }
    .modal img{ width:100%; height:auto; display:block; }
    .modal .closeRow{ padding:12px 14px 16px; }
    .modal .closeRow button{
      background:#111827; color:white; border-color:#111827;
      min-width:auto; padding:10px 14px; font-size:14px;
    }

    /* Fyrverkeri */
    canvas#fx{ position:fixed; inset:0; z-index:60; pointer-events:none; display:none; }
    canvas#fx.show{ display:block; }

    .pulse{ animation: pulse 0.8s ease-in-out infinite; }
    @keyframes pulse{ 0%,100%{ filter: brightness(1); } 50%{ filter: brightness(1.06); } }
  </style>
</head>

<body>
  <canvas id="fx"></canvas>

  <main class="card">
    <h1 class="title" id="title">Vill du vara min Valentine? 💘</h1>
    <p class="subtitle" id="subtitle">Det här är en helt normal hemsida. (I typ 5 sekunder.)</p>

    <div class="buttons">
      <button id="yesBtn">JA 💖</button>
      <button id="noBtn">NEJ 🙃</button>
    </div>

    <div class="hint" id="hint">(Tips: lägg till ?namn=Emma i länken)</div>
  </main>

  <div class="overlay" id="overlay" aria-hidden="true">
    <div class="modal">
      <div class="top">
        <h2 id="modalTitle">🙂</h2>
        <p id="modalText">...</p>
      </div>
      <img id="modalImg" alt="bild" />
      <div class="closeRow">
        <button id="closeBtn">Stäng</button>
      </div>
    </div>
  </div>

  <script>
    /***************
     * BILDER (lägg dessa filer bredvid index.html)
     ***************/
    const YES_IMG = "ja.jpeg";   // katten
    const NO_IMG  = "nej.jpeg";  // den andra bilden

    // Anpassning via URL: ?namn=Emma
    const params = new URLSearchParams(location.search);
    const namn = params.get("namn");
    if (namn) {
      document.getElementById("title").textContent = `Vill du vara min Valentine, ${namn}? 💘`;
      document.getElementById("hint").textContent = `Hej ${namn} 😌`;
    }

    const yesBtn = document.getElementById("yesBtn");
    const noBtn  = document.getElementById("noBtn");

    const overlay = document.getElementById("overlay");
    const modalTitle = document.getElementById("modalTitle");
    const modalText  = document.getElementById("modalText");
    const modalImg   = document.getElementById("modalImg");
    const closeBtn   = document.getElementById("closeBtn");

    function openModal({title, text, imgSrc, closeLabel="Stäng"}){
      modalTitle.textContent = title;
      modalText.textContent = text;
      modalImg.src = imgSrc;
      closeBtn.textContent = closeLabel;
      overlay.classList.add("show");
      overlay.setAttribute("aria-hidden", "false");
    }
    function closeModal(){
      overlay.classList.remove("show");
      overlay.setAttribute("aria-hidden", "true");
    }
    closeBtn.addEventListener("click", closeModal);
    overlay.addEventListener("click", (e) => { if(e.target === overlay) closeModal(); });

    /***************
     * Efter 5 sek: JA växer och "äter" NEJ
     ***************/
    let growthTimer = setTimeout(() => {
      let yesScale = 1;
      let noScale  = 1;

      yesBtn.classList.add("pulse");

      const interval = setInterval(() => {
        yesScale *= 1.06;   // JA blir större
        noScale  *= 0.92;   // NEJ krymper

        yesBtn.style.transform = `scale(${yesScale})`;
        noBtn.style.transform  = `scale(${noScale})`;

        const noOpacity = Math.max(0, (noScale - 0.15) / 0.85);
        noBtn.style.opacity = String(noOpacity);

        if (noScale < 0.18 || noOpacity <= 0.02) {
          noBtn.style.display = "none";
          clearInterval(interval);
        }
      }, 120);
    }, 5000);

    /***************
     * KLICKS
     ***************/
    yesBtn.addEventListener("click", () => {
      clearTimeout(growthTimer);
      noBtn.style.display = "none";
      yesBtn.classList.remove("pulse");

      openModal({
        title: "YAAAAY 🥰",
        text: "Okej då är det bestämt 💞",
        imgSrc: YES_IMG,
        closeLabel: "Jag med 😌"
      });

      // Fyrverkerier bara på JA
      fireworksBurst(9);
      let waves = 0;
      const waveInt = setInterval(() => {
        fireworksBurst(6);
        waves++;
        if (waves >= 5) clearInterval(waveInt);
      }, 520);
    });

    noBtn.addEventListener("click", () => {
      clearTimeout(growthTimer);
      yesBtn.classList.remove("pulse");

      openModal({
        title: "🤨",
        text: "Intressant val…",
        imgSrc: NO_IMG,
        closeLabel: "Jag ångrar mig"
      });

      // Bonus: efter NEJ, gör JA lite större direkt (lite bus)
      yesBtn.style.transform = `scale(${1.25})`;
    });

    /***************
     * Fyrverkerier (canvas)
     ***************/
    const canvas = document.getElementById("fx");
    const ctx = canvas.getContext("2d");
    let particles = [];
    let raf = null;

    function resize(){
      canvas.width  = window.innerWidth  * devicePixelRatio;
      canvas.height = window.innerHeight * devicePixelRatio;
      ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
    }
    window.addEventListener("resize", resize);
    resize();

    function fireworksBurst(count){
      canvas.classList.add("show");
      for(let i=0;i<count;i++){
        const x = rand(0.15, 0.85) * window.innerWidth;
        const y = rand(0.15, 0.55) * window.innerHeight;
        explode(x, y, Math.floor(rand(45, 85)));
      }
      if (!raf) raf = requestAnimationFrame(tick);
    }

    function explode(x, y, n){
      for(let i=0;i<n;i++){
        const a = Math.random() * Math.PI * 2;
        const sp = rand(2.5, 7.5);
        particles.push({
          x, y,
          vx: Math.cos(a) * sp,
          vy: Math.sin(a) * sp,
          life: rand(35, 70),
          age: 0,
          size: rand(1.5, 3.5),
          hue: Math.floor(Math.random() * 360)
        });
      }
    }

    function tick(){
      ctx.clearRect(0,0,window.innerWidth, window.innerHeight);
      ctx.globalCompositeOperation = "lighter";

      particles = particles.filter(p => p.age < p.life);
      for(const p of particles){
        p.age++;
        p.vy += 0.06;
        p.vx *= 0.985;
        p.vy *= 0.985;
        p.x += p.vx;
        p.y += p.vy;

        const t = 1 - (p.age / p.life);
        ctx.beginPath();
        ctx.fillStyle = `hsla(${p.hue}, 95%, 60%, ${Math.max(0, t)})`;
        ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
        ctx.fill();
      }
      ctx.globalCompositeOperation = "source-over";

      if (particles.length > 0){
        raf = requestAnimationFrame(tick);
      } else {
        canvas.classList.remove("show");
        raf = null;
      }
    }
    function rand(min, max){ return Math.random()*(max-min)+min; }
  </script>
</body>
</html>
