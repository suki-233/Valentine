<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>💘 En fråga...</title>
  <style>
    :root{
      --bg1:#ffdde1;
      --bg2:#ee9ca7;
      --card:#ffffffcc;
      --text:#2b2b2b;
      --yes:#22c55e;
      --no:#ef4444;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color:var(--text);
      background: radial-gradient(circle at top, var(--bg1), var(--bg2));
      overflow:hidden;
    }
    .hearts{
      position:fixed;
      inset:0;
      pointer-events:none;
      opacity:.35;
      background:
        radial-gradient(circle at 10% 20%, #fff 0 2px, transparent 3px),
        radial-gradient(circle at 80% 30%, #fff 0 2px, transparent 3px),
        radial-gradient(circle at 40% 80%, #fff 0 2px, transparent 3px),
        radial-gradient(circle at 70% 70%, #fff 0 2px, transparent 3px);
      filter: blur(.2px);
    }
    .card{
      width:min(92vw, 520px);
      padding:28px 22px;
      border-radius:24px;
      background:var(--card);
      backdrop-filter: blur(8px);
      box-shadow:0 18px 60px rgba(0,0,0,.18);
      text-align:center;
      position:relative;
    }
    h1{
      margin:0 0 10px;
      font-size:clamp(26px, 4.2vw, 38px);
      line-height:1.1;
    }
    p{
      margin:0 0 18px;
      font-size:clamp(15px, 2.2vw, 18px);
      opacity:.9;
    }
    .name{
      font-weight:700;
      background: linear-gradient(90deg, #ff4d6d, #7c3aed);
      -webkit-background-clip:text;
      background-clip:text;
      color:transparent;
    }
    .buttons{
      display:flex;
      gap:12px;
      justify-content:center;
      align-items:center;
      flex-wrap:wrap;
      margin-top:10px;
    }
    button{
      border:0;
      padding:12px 18px;
      border-radius:999px;
      font-size:16px;
      font-weight:700;
      cursor:pointer;
      box-shadow:0 10px 24px rgba(0,0,0,.15);
      transition: transform .08s ease, filter .12s ease;
      user-select:none;
    }
    button:active{ transform: scale(.98); }
    .yes{ background:var(--yes); color:white; }
    .no{ background:var(--no); color:white; position:relative; }
    .footer{
      margin-top:14px;
      font-size:13px;
      opacity:.75;
    }
    .toast{
      display:none;
      margin-top:16px;
      padding:14px 14px;
      border-radius:16px;
      background:#111827;
      color:white;
      font-weight:700;
    }
    .show{ display:block; }

    /* confetti */
    .confetti{
      position:fixed;
      inset:0;
      pointer-events:none;
      overflow:hidden;
    }
    .piece{
      position:absolute;
      top:-10px;
      width:10px;height:14px;
      opacity:.9;
      transform: rotate(0deg);
      animation: fall linear forwards;
    }
    @keyframes fall{
      to{
        transform: translateY(110vh) rotate(720deg);
      }
    }
  </style>
</head>
<body>
  <div class="hearts"></div>
  <div class="confetti" id="confetti"></div>

  <main class="card">
    <h1>Hej <span class="name" id="herName">älskling</span> 💘</h1>
    <p>
      Jag har en viktig fråga…<br/>
      Vill du vara min Valentine?
    </p>

    <div class="buttons">
      <button class="yes" id="yesBtn">JA!! 💖</button>
      <button class="no" id="noBtn">Nja… 😅</button>
    </div>

    <div class="toast" id="toast">
      YAY! 🥰 Då är det bestämt. Jag älskar dig! 💞
    </div>

    <div class="footer">
      (Psst: du kan ändra texten högst upp i koden för att anpassa den.)
    </div>
  </main>

  <script>
    // Ändra namnet här (eller läs från URL: ?namn=Emma)
    const params = new URLSearchParams(location.search);
    const namn = params.get("namn");
    if (namn) document.getElementById("herName").textContent = namn;

    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const toast = document.getElementById("toast");
    const confetti = document.getElementById("confetti");

    // "Nej" försöker smita undan 😄
    noBtn.addEventListener("mouseenter", () => {
      const pad = 20;
      const maxX = window.innerWidth - noBtn.offsetWidth - pad;
      const maxY = window.innerHeight - noBtn.offsetHeight - pad;

      const x = Math.random() * maxX + pad/2;
      const y = Math.random() * maxY + pad/2;

      noBtn.style.position = "fixed";
      noBtn.style.left = x + "px";
      noBtn.style.top  = y + "px";
    });

    // På mobil: flytta när man trycker
    noBtn.addEventListener("touchstart", (e) => {
      e.preventDefault();
      noBtn.dispatchEvent(new Event("mouseenter"));
    }, {passive:false});

    // Ja = confetti + kärleksmeddelande
    yesBtn.addEventListener("click", () => {
      toast.classList.add("show");
      spawnConfetti(140);
      yesBtn.textContent = "JAAAA 💞";
      noBtn.style.display = "none";
    });

    function spawnConfetti(n){
      confetti.innerHTML = "";
      for(let i=0;i<n;i++){
        const d = document.createElement("div");
        d.className = "piece";
        d.style.left = (Math.random()*100) + "vw";
        d.style.animationDuration = (1.8 + Math.random()*1.8) + "s";
        d.style.animationDelay = (Math.random()*0.2) + "s";
        d.style.borderRadius = (Math.random() > 0.5 ? "2px" : "999px");
        d.style.background = `hsl(${Math.floor(Math.random()*360)}, 90%, 60%)`;
        d.style.width = (6 + Math.random()*10) + "px";
        d.style.height = (8 + Math.random()*14) + "px";
        confetti.appendChild(d);
        requestAnimationFrame(()=> d.style.animationName = "fall");
      }
      setTimeout(()=> confetti.innerHTML = "", 4200);
    }
  </script>
</body>
</html>
